# The only contract is Morpho's Universal Rewards Distributor, unmodified, pinned at 3de504b.
# It is compiled with Morpho's own settings (lib/universal-rewards-distributor/foundry.toml:
# solc 0.8.19, paris, via_ir, 200 runs, no metadata hash) so the bytecode can be compared with theirs.
[profile.default]
src = "lib/universal-rewards-distributor/src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.19"
evm_version = "paris"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
auto_detect_remappings = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
hydration = "${RPC_HYDRATION}"
