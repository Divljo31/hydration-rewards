name: Image

# Optional manual publishing on GitHub's runners. Normal releases use local Docker logins.
# Builds linux/amd64 for Galactic Council GHCR and, when configured, Docker Hub.
# Nothing is deployed from here: the stack (docker/stack.yml) is updated by hand in Swarmpit, because
# a new program file has to go live between two closes.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: docker.io/galacticcouncil/hydration-rewards
  GHCR_IMAGE: ghcr.io/galacticcouncil/hydration-rewards

jobs:
  build:
    name: Build and push
    # A manual run from another branch must not replace the image production pulls.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Log in to Docker Hub
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] && [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::notice::Docker Hub secrets are not configured; publish its image with the local registry login.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          : "${DOCKERHUB_USERNAME:?Set the DOCKERHUB_USERNAME repository secret}"
          : "${DOCKERHUB_TOKEN:?Set the DOCKERHUB_TOKEN repository secret}"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          echo 'enabled=true' >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          PUBLISH_DOCKERHUB: ${{ steps.dockerhub.outputs.enabled }}
        run: |
          tags=(--tag "$GHCR_IMAGE:latest" --tag "$GHCR_IMAGE:$GITHUB_SHA")
          if [ "$PUBLISH_DOCKERHUB" = true ]; then
            tags+=(--tag "$DOCKERHUB_IMAGE:latest" --tag "$DOCKERHUB_IMAGE:$GITHUB_SHA")
          fi
          docker buildx build --platform linux/amd64 \
            --build-arg VCS_REF="$GITHUB_SHA" \
            "${tags[@]}" \
            --push .

      - name: Verify matching registry digests
        if: steps.dockerhub.outputs.enabled == 'true'
        run: |
          hub_digest=$(docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          ghcr_digest=$(docker buildx imagetools inspect "$GHCR_IMAGE:$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          test -n "$hub_digest" && test "$hub_digest" = "$ghcr_digest"
          printf 'Both registries published %s\n' "$hub_digest"
